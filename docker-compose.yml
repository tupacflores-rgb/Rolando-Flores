services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: planta
      POSTGRES_USER: planta
      POSTGRES_PASSWORD: planta
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planta -d planta"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - planta-lan
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@db:5432/$${POSTGRES_DB}
      POSTGRES_USER: planta
      POSTGRES_PASSWORD: planta
      POSTGRES_DB: planta
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: broker,sim,localhost,db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - planta-lan
    labels:
      academia.planta: pc
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M
networks:
  planta-lan:
    name: planta-lan
    driver: bridge
    external: true
volumes:
  postgres_data:
