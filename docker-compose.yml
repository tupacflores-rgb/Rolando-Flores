services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: planta
      POSTGRES_USER: planta
      POSTGRES_PASSWORD: planta
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planta -d planta"]
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      academia.planta: pc
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
    networks:
      - planta-lan
  api:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        contrato: ../academia2026-tp/contrato
    environment:
      DATABASE_URL: postgresql://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@db:5432/$${POSTGRES_DB}
      POSTGRES_USER: planta
      POSTGRES_PASSWORD: planta
      POSTGRES_DB: planta
      MQTT_HOST: broker
      MQTT_PORT: "1883"
      SISTEMA_NOMBRE: planta
      PLANTA_URL: http://sim:8100
      HTTP_PROXY: ${HTTP_PROXY:-http://enlace:3128}
      HTTPS_PROXY: ${HTTPS_PROXY:-http://enlace:3128}
      NO_PROXY: broker,sim,localhost,db
      WHISPER_MODEL_PATH: /models/whisper-small
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models:ro
    networks:
      - planta-lan
    labels:
      academia.planta: pc
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M
networks:
  planta-lan:
    name: planta-lan
    driver: bridge
    external: true
volumes:
  postgres_data:
