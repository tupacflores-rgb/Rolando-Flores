[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planta-inyeccion-agua"
version = "0.1.0"
description = "Nucleo determinista local para una planta de inyeccion de agua"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "psycopg[binary]>=3.1",
  "PyYAML>=6.0",
  "paho-mqtt>=2.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
test = ["httpx>=0.27", "pytest>=8.0"]
official = ["planta_contrato"]
integration = ["paho-mqtt>=2.1"]
voice = ["faster-whisper>=1.1", "huggingface-hub>=0.25"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
